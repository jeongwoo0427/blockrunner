<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BlockRunner game">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BlockRunner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BlockRunner</title>
  <link rel="manifest" href="manifest.json">

  <!--
    부팅 로딩 화면.

    Flutter 는 첫 프레임을 그리기 전까지 <body> 에 아무것도 넣지 않는다. 엔진 wasm 이
    수 MB 라 그동안 화면이 완전히 하얗고, 느린 망에서는 "안 뜨는 앱" 으로 읽힌다.
    그 구간을 메우는 것이 이 화면이며, **Dart 가 아직 없을 때 떠야 하므로** 색을
    여기에 다시 적는다. lib/core/theme/ 와 값이 중복되지만 피할 방법이 없다.

    값의 출처: BoardColors.light/.dark 의 playerBlock(막대) 와 ColorScheme.fromSeed 의
    surface·onSurfaceVariant·surfaceContainerHighest (바탕·글자·바 트랙).
    **바탕색이 어긋나면 첫 프레임에서 화면이 번쩍인다** — 그래서 실측한 값을 적었다.

    **진행률만 둔다.** 앱 스플래시(splash_screen.dart)의 블록 연출을 여기에도 그리면
    첫 프레임 직후 같은 연출이 한 번 더 재생돼 되감기처럼 보인다. 연출은 스플래시가
    맡고 이 화면은 "얼마나 받았는가" 만 말한다.

    문구는 영어 한 가지다. 앱은 5개 언어지만 이 화면은 AppStrings 를 쓸 수 없어
    (Dart 가 아직 없다) 여기에 언어 목록을 다시 만들면 두 곳이 갈라진다.
  -->
  <style>
    :root {
      --br-bg: #FAF8FF;              /* ColorScheme.light.surface */
      --br-player: #2E63E8;          /* BoardColors.light.playerBlock */
      --br-track: #E3E2E9;           /* ColorScheme.light.surfaceContainerHighest */
      --br-text: #45464F;            /* ColorScheme.light.onSurfaceVariant */
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --br-bg: #121318;
        --br-player: #74A2FF;
        --br-track: #33343A;
        --br-text: #C5C6D0;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--br-bg);
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--br-bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 250ms ease;
    }

    /* 첫 프레임이 오면 걷힌다. 뒤에서 스플래시가 이미 시작했으므로 뚝 끊기보다
       겹쳐 사라지는 편이 이어져 보인다. */
    #boot.gone {
      opacity: 0;
      pointer-events: none;
    }

    #boot-track {
      width: 176px;
      height: 6px;
      border-radius: 3px;
      background: var(--br-track);
      overflow: hidden;
    }

    #boot-fill {
      width: 0;
      height: 100%;
      border-radius: 3px;
      background: var(--br-player);
      transition: width 200ms ease;
    }

    /*
      전체 크기를 모르거나(gzip + chunked 인데 Range 도 막힌 경우) 내려받기가
      끝나고 엔진이 시동하는 동안. 퍼센트가 100% 에서 멈춰 있는 것처럼 보이는
      구간을 이 움직임이 대신 설명한다.
    */
    #boot-track.busy #boot-fill {
      width: 40%;
      transition: none;
      animation: boot-sweep 1100ms ease-in-out infinite;
    }

    @keyframes boot-sweep {
      from { transform: translateX(-100%); }
      to   { transform: translateX(250%); }
    }

    #boot-pct {
      margin-top: 14px;
      min-height: 1.2em;
      font-size: 13px;
      color: var(--br-text);
      /* 숫자 폭이 고정돼야 퍼센트가 바뀔 때 문구가 좌우로 흔들리지 않는다. */
      font-variant-numeric: tabular-nums;
    }

    /* 동작 줄이기 설정에서는 쓸기를 멈춘다 (기획서 §7). */
    @media (prefers-reduced-motion: reduce) {
      #boot-track.busy #boot-fill { animation: none; }
      #boot-fill { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div id="boot-track" class="busy" role="progressbar" aria-label="Loading">
      <div id="boot-fill"></div>
    </div>
    <!-- 스크립트가 못 돌더라도 최소한 "받는 중" 은 보여야 한다. -->
    <div id="boot-pct">Loading…</div>
  </div>

  <!--
    **이 스크립트는 flutter_bootstrap.js 보다 앞에 있어야 한다.** 인라인 스크립트는
    파싱 중 즉시 실행되므로 async 인 부트스트랩보다 항상 먼저 돌고, 그래야 엔진이
    거는 fetch 를 처음부터 지켜볼 수 있다. 순서를 바꾸면 진행률이 조용히 0 에 멈춘다.
  -->
  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;

      var track = document.getElementById('boot-track');
      var fill = document.getElementById('boot-fill');
      var label = document.getElementById('boot-pct');
      var origFetch = window.fetch;

      // 앱은 5개 언어지만 이 화면은 AppStrings 를 쓸 수 없어 영어 하나로 둔다.
      // 마크업의 초기값과 같아야 한다 — 스크립트가 못 돌 때 그것이 남는다.
      var LOADING = 'Loading…';

      // url -> { loaded, total, resolved }
      var files = Object.create(null);
      var shown = 0;
      var starting = false;

      function render() {
        if (starting) return;

        var loaded = 0, total = 0, pending = false, unknown = false;
        for (var url in files) {
          var f = files[url];
          loaded += f.loaded;
          if (!f.resolved) pending = true;
          else if (f.total) total += f.total;
          else unknown = true;
        }

        // 아직 총 크기를 묻는 중이면 숫자를 보이지 않는다. Range 프로브는 한 왕복이라
        // 짧고, 그 사이에 용량을 보였다가 퍼센트로 바꾸면 표시가 튄다.
        if (pending) return;

        if (unknown || !total) {
          // 분모를 끝내 못 얻었다 — 받은 용량만이라도 정직하게 보여준다.
          track.classList.add('busy');
          label.textContent = loaded
            ? LOADING + ' ' + (loaded / 1048576).toFixed(1) + ' MB'
            : LOADING;
          return;
        }

        var percent = Math.min(100, Math.floor(loaded * 100 / total));
        // 두 wasm 이 거의 동시에 시작하지만 등록 순서에 따라 분모가 뒤늦게 커질 수
        // 있다. 그때 숫자가 뒤로 가면 고장 난 것처럼 보이므로 앞으로만 움직인다.
        if (percent <= shown) return;
        shown = percent;

        track.classList.remove('busy');
        fill.style.width = shown + '%';
        label.textContent = LOADING + ' ' + shown + '%';
        track.setAttribute('aria-valuenow', String(shown));

        if (shown >= 100) startingUp();
      }

      // 셀 수 있는 것은 다 받았고, 이제 엔진이 시동한다.
      //
      // canvaskit 경로의 main.dart.js 는 <script> 태그로 들어와 셀 수가 없다.
      // 100% 에 멈춰 있는 것처럼 두지 않고 쓸기로 바꾼다.
      function startingUp() {
        starting = true;
        track.classList.add('busy');
        label.textContent = 'Starting…';
        track.removeAttribute('aria-valuenow');
      }

      // 총 크기를 1바이트 요청으로 묻는다.
      //
      // gzip 이 켜지면 nginx 는 Content-Length 를 떼고 chunked 로 보내 분모가
      // 사라진다. 다만 206 응답은 압축하지 않고, range 헤더 필터가 gzip 필터보다
      // 먼저 돌기 때문에 이 요청은 압축 여부와 무관하게 원본 크기를 돌려준다.
      function probeTotal(url, entry) {
        origFetch(url, { headers: { 'Range': 'bytes=0-0' } })
          .then(function (res) {
            if (res.status === 206) {
              var range = res.headers.get('content-range');  // "bytes 0-0/7229467"
              var match = range && /\/(\d+)\s*$/.exec(range);
              if (match) entry.total = parseInt(match[1], 10) || 0;
            }
            // **몸통은 절대 읽지 않는다.** 206 이 아니면 서버가 Range 를 무시하고
            // 파일 전체를 보내는 중이라, 읽으면 같은 것을 두 번 받는다. 끊어야
            // 분모를 못 얻었다는 사실이 곧바로 정해지고 용량 표시로 떨어진다.
            if (res.body) {
              try { res.body.cancel(); } catch (e) {}
            }
          })
          .catch(function () {})
          .then(function () {
            entry.resolved = true;
            render();
          });
      }

      function watch(url, res) {
        if (!res.ok || !res.body || files[url]) return;

        var entry = { loaded: 0, total: 0, resolved: false };
        files[url] = entry;

        var length = res.headers.get('content-length');
        var encoding = res.headers.get('content-encoding');
        // 압축된 응답의 Content-Length 는 **압축된 크기**인데 아래에서 세는 것은
        // 압축이 풀린 바이트라 단위가 어긋난다. 그때는 헤더를 믿지 않는다.
        if (length && !encoding) {
          entry.total = parseInt(length, 10) || 0;
          entry.resolved = true;
        } else {
          probeTotal(url, entry);
        }
        render();

        // 원본 Response 는 손대지 않고 사본만 읽는다. 새로 만들어 돌려주면
        // compileStreaming 의 MIME 검사에 걸릴 수 있다.
        var reader = res.clone().body.getReader();
        (function pump() {
          reader.read().then(function (chunk) {
            if (chunk.done) return;
            entry.loaded += chunk.value.length;
            render();
            pump();
          }).catch(function () {});
        })();
      }

      // 엔진 wasm 은 전부 fetch 로 들어온다 (main.dart.wasm 은 compileStreaming,
      // skwasm/canvaskit 은 WebAssembly.compileStreaming).
      //
      // **어느 단계가 실패해도 원본 결과를 그대로 돌려준다.** 로딩 표시 때문에
      // 앱이 못 뜨는 일은 없어야 한다.
      window.fetch = function (input) {
        var result = origFetch.apply(this, arguments);
        try {
          var url = typeof input === 'string'
            ? input
            : (input && input.url) ? input.url : String(input);
          if (/\.wasm(\?|$)/.test(url)) {
            return result.then(function (res) {
              try { watch(url, res); } catch (e) {}
              return res;
            });
          }
        } catch (e) {}
        return result;
      };

      // 타임아웃으로 걷지 않는다 — 앱이 못 뜬 상태에서 걷으면 다시 흰 화면이다.
      window.addEventListener('flutter-first-frame', function () {
        window.fetch = origFetch;
        boot.classList.add('gone');
        setTimeout(function () {
          if (boot.parentNode) boot.parentNode.removeChild(boot);
        }, 300);
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
