# Flutter Web(WASM) 배포용 서버 설정.
# Dockerfile 이 /etc/nginx/conf.d/default.conf 로 복사한다.
#
# 전제: nginx 1.21.0 이상 (기본 mime.types 에 application/wasm 이 있어야 한다).
#       그 미만이면 .wasm 이 octet-stream 으로 나가 WASM 로딩이 실패한다.
#       올리기 어려우면 http 블록의 include mime.types; 다음 줄에
#       types { application/wasm wasm; } 를 추가할 것.
#       (server 블록 안에 쓰면 매핑 전체를 덮어써서 CSS/JS 가 깨진다)
#
#       .mjs 는 이 버전 mime.types 에 **없어서** 아래 location 으로 따로 잡아 준다.

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    ##
    ## 압축 - 첫 로딩에서 실제로 받는 것이 절반 이하가 된다 (실측).
    ##   WasmGC 브라우저   main.dart.wasm 2,187K -> 807K · skwasm.wasm 3,497K -> 1,499K
    ##   그 외             main.dart.js   2,535K -> 752K · canvaskit.wasm 7,060K -> 2,835K
    ## png 는 이미 압축돼 있어 대상에서 뺀다.
    ##
    ## `.symbols` 와 `assets/NOTICES` 는 매핑이 없어 octet-stream 으로 나가 압축되지 않는다.
    ## 둘 다 런타임에 받지 않는 파일이라(스택 심볼화 · 라이선스 표시용) 그대로 둔다.
    ## 여기에 octet-stream 을 넣으면 매핑 없는 모든 것을 압축하게 되므로 그러지 않는다.
    ##
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml
        font/otf
        font/ttf;

    ##
    ## main.dart.mjs — wasm 진입점. **ES 모듈이라 MIME 을 엄격히 검사한다.**
    ##
    ## 이 버전 mime.types 에 .mjs 매핑이 없어 application/octet-stream 으로 나가면
    ## 브라우저가 모듈 로드를 거부해 화면이 흰 채로 멈춘다
    ## ("Expected a JavaScript-or-Wasm module script but the server responded with
    ##  a MIME type of application/octet-stream").
    ##
    ## types { } 대신 default_type 을 쓰는 이유: server/location 안의 types 블록은
    ## 상위 매핑을 **병합이 아니라 통째로 대체**해서 CSS/JS 까지 깨진다(위 주석 참고).
    ## default_type 은 "매핑에 없을 때 쓸 타입"만 바꾸므로 부작용이 없다.
    ##
    ## 이 블록이 try_files 밖이라 없는 .mjs 는 index.html 이 아니라 404 로 떨어진다 —
    ## 그게 맞다. HTML 을 모듈로 받으면 원인을 찾기 어려운 실패가 된다.
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
